<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HSM ICT Mentor</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f;
  --surface:#111118;
  --surface2:#1a1a24;
  --border:#2a2a3a;
  --gold:#f0c040;
  --gold2:#d4a820;
  --green:#3fb950;
  --red:#f85149;
  --blue:#58a6ff;
  --purple:#bc8cff;
  --muted:#6e7681;
  --text:#e6edf3;
  --text2:#b1bac4;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:40px;}

/* HEADER */
.header{background:linear-gradient(135deg,#0d0d18 0%,#111128 100%);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
.header-logo{width:36px;height:36px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#000;font-family:'Space Mono',monospace;}
.header-title{font-size:16px;font-weight:700;color:var(--gold);font-family:'Space Mono',monospace;letter-spacing:1px;}
.header-sub{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}

/* BIAS CARD */
.bias-card{margin:16px;border-radius:16px;padding:16px;border:1px solid var(--border);background:var(--surface);transition:all .3s;}
.bias-card.bullish{border-color:#3fb95044;background:linear-gradient(135deg,#0d1f12,#111a14);}
.bias-card.bearish{border-color:#f8514944;background:linear-gradient(135deg,#1f0d0d,#1a1111);}
.bias-card.neutral{border-color:#e3b34144;background:linear-gradient(135deg,#1a1a0d,#18180d);}
.bias-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.bias-left{display:flex;align-items:center;gap:10px;}
.bias-icon-wrap{font-size:24px;}
.bias-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;}
.bias-text{font-size:20px;font-weight:700;font-family:'Space Mono',monospace;color:var(--gold);}
.bias-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.bias-price-block{text-align:right;}
.bias-price{font-size:18px;font-weight:700;font-family:'Space Mono',monospace;color:var(--text);}
.bias-change{font-size:12px;font-weight:600;font-family:'Space Mono',monospace;}

/* SPARKLINE */
.spark-wrap{margin:8px 0;height:38px;}
.spark-wrap svg{width:100%;height:38px;}
.spark-area{fill-opacity:.15;}

/* SENTIMENT BAR */
.sent-bar-wrap{margin-top:10px;}
.sent-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:4px;}
.sent-bar{position:relative;height:6px;background:linear-gradient(90deg,var(--red),#e3b341,var(--green));border-radius:3px;}
.sent-needle{position:absolute;top:-3px;width:12px;height:12px;background:#fff;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 6px rgba(255,255,255,.5);transition:left .5s;}

/* STATS ROW */
.stats-row{display:flex;gap:8px;margin-top:10px;}
.stat-box{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center;}
.stat-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.stat-val{font-size:13px;font-weight:700;font-family:'Space Mono',monospace;color:var(--text);margin-top:2px;}

/* SECTION */
.section{margin:0 16px 16px;}
.section-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;font-family:'Space Mono',monospace;}

/* PAIR BUTTONS */
.pairs-wrap{display:flex;flex-wrap:wrap;gap:6px;}
.pair-btn{background:var(--surface);border:1px solid var(--border);color:var(--text2);padding:7px 12px;border-radius:8px;font-size:12px;font-family:'Space Mono',monospace;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;}
.pair-btn.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;border-color:transparent;font-weight:700;}

/* UPLOAD SLOTS */
.slots-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.slot{background:var(--surface);border:1px dashed var(--border);border-radius:12px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;}
.slot:active{transform:scale(.97);}
.slot.filled{border-style:solid;border-color:var(--gold);}
.slot-icon{font-size:22px;margin-bottom:4px;}
.slot-tf{font-size:11px;font-weight:700;font-family:'Space Mono',monospace;color:var(--gold);}
.slot-label{font-size:9px;color:var(--muted);margin-top:2px;text-align:center;padding:0 4px;}
.slot-preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7;}
.upload-input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}

/* ANALYZE BTN */
.analyze-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;border:none;border-radius:14px;font-size:15px;font-weight:700;font-family:'Space Mono',monospace;cursor:pointer;letter-spacing:1px;transition:all .2s;-webkit-tap-highlight-color:transparent;}
.analyze-btn:disabled{opacity:.5;cursor:not-allowed;}
.analyze-btn:active:not(:disabled){transform:scale(.98);}

/* LOADING */
.loading{display:none;text-align:center;padding:30px;color:var(--muted);}
.loading.show{display:block;}
.loading-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* RESULT */
.result{display:none;}
.result.show{display:block;}

/* SCORE CARD */
.score-card{margin:16px;border-radius:16px;padding:16px;border:1px solid var(--border);background:var(--surface);}
.score-card.bull{border-color:#3fb95066;background:linear-gradient(135deg,#0d1f12,#111a14);}
.score-card.bear{border-color:#f8514966;background:linear-gradient(135deg,#1f0d0d,#1a1111);}
.score-card.neutral{border-color:#e3b34166;}
.score-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.score-direction{font-size:22px;font-weight:700;font-family:'Space Mono',monospace;}
.score-direction.bull{color:var(--green);}
.score-direction.bear{color:var(--red);}
.score-direction.neutral{color:#e3b341;}
.score-badge{font-size:18px;font-weight:700;font-family:'Space Mono',monospace;padding:6px 14px;border-radius:8px;}
.score-badge.high{background:#3fb95022;color:var(--green);border:1px solid #3fb95044;}
.score-badge.mid{background:#e3b34122;color:#e3b341;border:1px solid #e3b34144;}
.score-badge.low{background:#f8514922;color:var(--red);border:1px solid #f8514944;}
.score-bar-wrap{background:var(--surface2);border-radius:4px;height:6px;margin-bottom:10px;}
.score-bar{height:6px;border-radius:4px;transition:width .5s;}
.score-bar.bull{background:linear-gradient(90deg,#3fb950,#58d068);}
.score-bar.bear{background:linear-gradient(90deg,#f85149,#ff6b6b);}
.score-bar.neutral{background:linear-gradient(90deg,#e3b341,#f0c040);}

/* ANALYSIS CARD */
.analysis-card{margin:0 16px 16px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;}
.analysis-card h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;font-family:'Space Mono',monospace;}
.analysis-text{font-size:13px;line-height:1.7;color:var(--text2);}
.analysis-text p{margin-bottom:8px;}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:600;margin:0 1px;}
.tag-bull{background:#3fb95022;color:var(--green);border:1px solid #3fb95033;}
.tag-bear{background:#f8514922;color:var(--red);border:1px solid #f8514933;}
.tag-info{background:#58a6ff22;color:var(--blue);border:1px solid #58a6ff33;}
.tag-warn{background:#e3b34122;color:#e3b341;border:1px solid #e3b34133;}

/* ALERT BOX */
.alert-box{margin:0 16px 16px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;}
.alert-box-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;font-family:'Space Mono',monospace;margin-bottom:12px;}
.alert-row{display:flex;gap:8px;}
.alert-input{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:10px;font-size:14px;font-family:'Space Mono',monospace;outline:none;}
.alert-input:focus{border-color:var(--gold);}
.alert-create-btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;border:none;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;font-family:'Space Mono',monospace;cursor:pointer;}
.alert-status{margin-top:8px;font-size:12px;color:var(--muted);min-height:16px;}

/* RESET BTN */
.reset-btn{display:block;width:calc(100% - 32px);margin:0 16px 16px;padding:14px;background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:12px;font-size:13px;font-family:'Space Mono',monospace;cursor:pointer;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#1f2937;color:var(--text);padding:12px 20px;border-radius:10px;font-size:13px;z-index:999;transition:transform .3s;white-space:nowrap;border:1px solid var(--border);}
.toast.show{transform:translateX(-50%) translateY(0);}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:0 16px 16px;}
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">H</div>
  <div>
    <div class="header-title">HSM ICT MENTOR</div>
    <div class="header-sub">Smart Money Concepts</div>
  </div>
</div>

<!-- BIAS WIDGET -->
<div class="bias-card neutral" id="biasWidget">
  <div class="bias-top">
    <div class="bias-left">
      <div class="bias-icon-wrap" id="biasIcon">🟡</div>
      <div>
        <div class="bias-label">Market Bias</div>
        <div class="bias-text" id="biasText">NEUTRO</div>
        <div class="bias-sub" id="biasSub">A carregar dados...</div>
      </div>
    </div>
    <div class="bias-price-block">
      <div class="bias-price" id="btcPriceEl">--</div>
      <div class="bias-change" id="btcChangeEl">--</div>
    </div>
  </div>

  <div class="spark-wrap">
    <svg viewBox="0 0 300 36" preserveAspectRatio="none">
      <defs>
        <linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3fb950" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path id="sparkArea" d="M0,18 L300,18 L300,36 L0,36Z" fill="url(#sparkGrad)"/>
      <path id="sparkLine" d="M0,18 L300,18" fill="none" stroke="#3fb950" stroke-width="2"/>
    </svg>
  </div>

  <div class="sent-bar-wrap">
    <div class="sent-labels"><span id="lowEl">Low --</span><span id="rangeEl">50%</span><span id="highEl2">High --</span></div>
    <div class="sent-bar"><div class="sent-needle" id="sentNeedle" style="left:50%"></div></div>
  </div>

  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-label">24h High</div>
      <div class="stat-val" id="highEl">--</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Momentum</div>
      <div class="stat-val"><span id="momIcon">⚠️</span> <span id="momVal" style="color:#e3b341">WAIT</span></div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Range Pos</div>
      <div class="stat-val" id="rangePos">--</div>
    </div>
  </div>
</div>

<!-- PAR -->
<div class="section">
  <div class="section-title">Selecionar Par</div>
  <div class="pairs-wrap">
    <button class="pair-btn active" onclick="selectPair(this,'BTCUSD')">BTC</button>
    <button class="pair-btn" onclick="selectPair(this,'ETHUSD')">ETH</button>
    <button class="pair-btn" onclick="selectPair(this,'SOLUSD')">SOL</button>
    <button class="pair-btn" onclick="selectPair(this,'XRPUSD')">XRP</button>
    <button class="pair-btn" onclick="selectPair(this,'LINKUSD')">LINK</button>
    <button class="pair-btn" onclick="selectPair(this,'ADAUSD')">ADA</button>
    <button class="pair-btn" onclick="selectPair(this,'AVAXUSD')">AVAX</button>
    <button class="pair-btn" onclick="selectPair(this,'BNBUSD')">BNB</button>
    <button class="pair-btn" onclick="selectPair(this,'AAVEUSD')">AAVE</button>
  </div>
</div>

<div class="divider"></div>

<!-- GRAFICOS -->
<div class="section">
  <div class="section-title">Carregar Gráficos (mín. 2)</div>
  <div class="slots-grid">
    <div class="slot" id="slot-D1">
      <div class="slot-icon">📅</div>
      <div class="slot-tf">D1</div>
      <div class="slot-label">Diario</div>
      <input type="file" class="upload-input" id="inp-D1" accept="image/*" onchange="handleFile(this,'D1')">
    </div>
    <div class="slot" id="slot-H4">
      <div class="slot-icon">🕐</div>
      <div class="slot-tf">H4</div>
      <div class="slot-label">4 Horas</div>
      <input type="file" class="upload-input" id="inp-H4" accept="image/*" onchange="handleFile(this,'H4')">
    </div>
    <div class="slot" id="slot-H1">
      <div class="slot-icon">⏰</div>
      <div class="slot-tf">H1</div>
      <div class="slot-label">1 Hora</div>
      <input type="file" class="upload-input" id="inp-H1" accept="image/*" onchange="handleFile(this,'H1')">
    </div>
    <div class="slot" id="slot-M15">
      <div class="slot-icon">⚡</div>
      <div class="slot-tf">M15</div>
      <div class="slot-label">15 Min</div>
      <input type="file" class="upload-input" id="inp-M15" accept="image/*" onchange="handleFile(this,'M15')">
    </div>
    <div class="slot" id="slot-M5">
      <div class="slot-icon">🎯</div>
      <div class="slot-tf">M5</div>
      <div class="slot-label">5 Min Scalp</div>
      <input type="file" class="upload-input" id="inp-M5" accept="image/*" onchange="handleFile(this,'M5')">
    </div>
    <div class="slot" id="slot-M1">
      <div class="slot-icon">🔬</div>
      <div class="slot-tf">M1</div>
      <div class="slot-label">1 Min Opcional</div>
      <input type="file" class="upload-input" id="inp-M1" accept="image/*" onchange="handleFile(this,'M1')">
    </div>
  </div>
</div>

<!-- BOTAO ANALISAR -->
<div class="section">
  <button class="analyze-btn" id="analyzeBtn" onclick="analyze()">⚡ ANALISAR COM ICT MENTOR</button>
</div>

<!-- LOADING -->
<div class="loading" id="loading">
  <div class="loading-spinner"></div>
  <div style="font-family:'Space Mono',monospace;font-size:12px;letter-spacing:1px;">A analisar com IA...</div>
</div>

<!-- RESULTADO -->
<div class="result" id="result"></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
let selectedPair='BTCUSD';
let images={};
let lastAnalysis='';
let lastTimeframes='';

async function loadMarketBias(){
  const widget = document.getElementById('biasWidget');
  try{
    const symbol = 'BTCUSDT';
    const r = await fetch('https://api.bybit.com/v5/market/tickers?category=linear&symbol='+symbol);
    const resData = await r.json();
    if(!resData.result || !resData.result.list || !resData.result.list[0]) throw new Error("Erro API");
    
    const t = resData.result.list[0];
    const btcPrice = parseFloat(t.lastPrice);
    const btcChange = parseFloat(t.price24hPcnt) * 100;
    const high24h = parseFloat(t.highPrice24h);
    const low24h = parseFloat(t.lowPrice24h);
    
    window._btcData = { price: btcPrice, change: btcChange, high: high24h, low: low24h };
    const rangePos = low24h < high24h ? ((btcPrice - low24h) / (high24h - low24h)) * 100 : 50;

    let bias='NEUTRO', biasClass='neutral', biasIcon='🟡', biasSub='Aguarda confirmação';
    let momentumIcon='⚠️', momentumVal='WAIT', momentumColor='#e3b341';
    
    if(btcChange > 1.5 || (btcChange > 0.5 && rangePos > 60)){
      bias='BULLISH'; biasClass='bullish'; biasIcon='🟢'; biasSub='Favorece posições LONG';
      momentumIcon='📈'; momentumVal='BULL'; momentumColor='#3fb950';
    }else if(btcChange < -1.5 || (btcChange < -0.5 && rangePos < 40)){
      bias='BEARISH'; biasClass='bearish'; biasIcon='🔴'; biasSub='Favorece posições SHORT';
      momentumIcon='📉'; momentumVal='BEAR'; momentumColor='#f85149';
    }

    const changeStr = (btcChange >= 0 ? '▲ +' : '▼ ') + Math.abs(btcChange).toFixed(2) + '%';
    const rangePosR = Math.round(rangePos);
    const needlePos = Math.min(Math.max(rangePosR, 5), 95);
    const sparkColor = btcChange >= 0 ? '#3fb950' : '#f85149';
    const sp = generateSparkline(btcChange);

    widget.className = 'bias-card ' + biasClass;
    
    document.getElementById('biasText').textContent = bias;
    document.getElementById('biasIcon').textContent = biasIcon;
    document.getElementById('biasSub').textContent = biasSub;
    document.getElementById('btcPriceEl').textContent = '$' + btcPrice.toLocaleString('en-US', {maximumFractionDigits:0});
    document.getElementById('btcChangeEl').textContent = changeStr;
    document.getElementById('btcChangeEl').style.color = btcChange >= 0 ? '#3fb950' : '#f85149';
    document.getElementById('rangeEl').textContent = rangePosR + '%';
    document.getElementById('highEl').textContent = '$' + Math.round(high24h).toLocaleString('en-US');
    document.getElementById('momIcon').textContent = momentumIcon;
    document.getElementById('momVal').textContent = momentumVal;
    document.getElementById('momVal').style.color = momentumColor;
    document.getElementById('lowEl').textContent = 'Low $' + Math.round(low24h).toLocaleString('en-US');
    document.getElementById('highEl2').textContent = 'High $' + Math.round(high24h).toLocaleString('en-US');
    document.getElementById('sentNeedle').style.left = needlePos + '%';
    
    const sLine = document.getElementById('sparkLine');
    const sArea = document.getElementById('sparkArea');
    if(sLine) sLine.setAttribute('d', sp.line);
    if(sLine) sLine.setAttribute('stroke', sparkColor);
    if(sArea) sArea.setAttribute('d', sp.area);
  }catch(e){
    widget.className = 'bias-card neutral';
    document.getElementById('biasSub').textContent = '⚠️ Erro API Bybit — Tenta novamente';
  }
}

function generateSparkline(change) {
  const pts = []; const n = 10;
  let y = change >= 0 ? 28 : 8;
  for(let i = 0; i < n; i++) {
    const x = (i / (n-1)) * 300;
    const noise = (Math.random() - 0.5) * 6;
    const trend = change >= 0 ? -i * 2.2 + 28 : i * 2.2 + 8;
    y = Math.min(34, Math.max(2, trend + noise));
    pts.push({x: Math.round(x), y: Math.round(y)});
  }
  const line = pts.map((p,i) => (i===0?'M':'L')+p.x+','+p.y).join(' ');
  const area = line + ' L300,36 L0,36Z';
  return {line, area};
}

function selectPair(el,pair){
  document.querySelectorAll('.pair-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  selectedPair=pair;
}

function handleFile(input,tf){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    const base64=e.target.result.split(',')[1];
    images[tf]={base64,mimeType:file.type};
    const slot=document.getElementById('slot-'+tf);
    slot.classList.add('filled');
    slot.innerHTML='<img src="'+e.target.result+'" class="slot-preview"><div class="slot-tf">'+tf+'</div><input type="file" class="upload-input" id="inp-'+tf+'" accept="image/*" onchange="handleFile(this,\''+tf+'\')">';
  };
  reader.readAsDataURL(file);
}

async function getPrice(pair){
  try{
    const symbolMap={'BTCUSD':'BTCUSDT','ETHUSD':'ETHUSDT','SOLUSD':'SOLUSDT','XRPUSD':'XRPUSDT','LINKUSD':'LINKUSDT','ADAUSD':'ADAUSDT','AVAXUSD':'AVAXUSDT','BNBUSD':'BNBUSDT','AAVEUSD':'AAVEUSDT'};
    const symbol=symbolMap[pair]||'BTCUSDT';
    const r=await fetch('https://api.bybit.com/v5/market/tickers?category=linear&symbol='+symbol);
    const d=await r.json();
    if(d.result&&d.result.list&&d.result.list[0]){
      const t=d.result.list[0];
      if(pair==='BTCUSD'){
        window._btcData={
          price:parseFloat(t.lastPrice),
          change:parseFloat(t.price24hPcnt)*100,
          high:parseFloat(t.highPrice24h),
          low:parseFloat(t.lowPrice24h)
        };
      }
      return parseFloat(t.lastPrice);
    }
    return null;
  }catch(e){return null;}
}

async function updateServerPrices(){
  try{
    const btcPrice=await getPrice('BTCUSD');
    loadMarketBias();

    const pairs=['ETHUSD','SOLUSD','XRPUSD','LINKUSD','ADAUSD','AVAXUSD','BNBUSD','AAVEUSD'];
    const priceObj={};
    if(btcPrice) priceObj['BTCUSD']=btcPrice;
    for(const pair of pairs){
      const price=await getPrice(pair);
      if(price) priceObj[pair]=price;
    }
    if(Object.keys(priceObj).length>0){
      await fetch('/update_prices',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(priceObj)
      });
    }
  }catch(e){}
}

setTimeout(updateServerPrices, 500);
setInterval(updateServerPrices, 15000);

async function analyze(){
  const tfList=Object.keys(images);
  if(tfList.length<2)return showToast('Carrega pelo menos 2 graficos');
  document.getElementById('analyzeBtn').disabled=true;
  document.getElementById('loading').classList.add('show');
  document.getElementById('result').classList.remove('show');
  document.getElementById('result').innerHTML='';
  try{
    const res=await fetch('/analyze',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pair:selectedPair,images})
    });
    const data=await res.json();
    if(data.error)throw new Error(data.error);
    lastAnalysis=data.result;
    lastTimeframes=Object.keys(images).join(',');
    renderResult(data.result);
  }catch(e){
    showToast('Erro: '+e.message);
  }finally{
    document.getElementById('analyzeBtn').disabled=false;
    document.getElementById('loading').classList.remove('show');
  }
}

function renderResult(text){
  const tl=text.toLowerCase();
  let dir='neutral',dirText='AGUARDA',scoreClass='mid';
  const buy=(tl.match(/compra|bullish|buy|long/g)||[]).length;
  const sell=(tl.match(/vend[ae]|bearish|sell|short/g)||[]).length;
  if(buy>sell){dir='bull';dirText='COMPRA';}
  else if(sell>buy){dir='bear';dirText='VENDA';}
  const sm=text.match(/(\d{1,3})\s*\/\s*100/);
  const score=sm?parseInt(sm[1]):50;
  if(score>=70)scoreClass='high';
  else if(score>=50)scoreClass='mid';
  else scoreClass='low';
  const formatted=text
    .replace(/\*\*(.+?)\*\*/g,'<strong style="color:var(--gold)">$1</strong>')
    .replace(/#{1,3}\s(.+)/g,'<strong style="color:var(--gold);font-size:13px;display:block;margin:12px 0 6px;font-family:Space Mono,monospace;text-transform:uppercase;letter-spacing:1px">$1</strong>')
    .replace(/BULLISH/g,'<span class="tag tag-bull">BULLISH</span>')
    .replace(/BEARISH/g,'<span class="tag tag-bear">BEARISH</span>')
    .replace(/\bFVG\b/g,'<span class="tag tag-info">FVG</span>')
    .replace(/\bCHoCH\b/g,'<span class="tag tag-warn">CHoCH</span>')
    .replace(/\bBOS\b/g,'<span class="tag tag-info">BOS</span>')
    .replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>').replace(/^/,'<p>').replace(/$/,'</p>');
  const html='<div class="score-card '+dir+'"><div class="score-header"><div class="score-direction '+dir+'">'+dirText+'</div><div class="score-badge '+scoreClass+'">'+score+'/100</div></div><div class="score-bar-wrap"><div class="score-bar '+dir+'" style="width:'+score+'%"></div></div><div style="font-size:12px;color:var(--muted);font-family:Space Mono,monospace">'+selectedPair+' ICT/SMC</div></div><div class="analysis-card"><h3>Analise Completa</h3><div class="analysis-text">'+formatted+'</div></div><div class="alert-box"><div class="alert-box-title">CRIAR ALERTA DE PRECO</div><div class="alert-row"><input id="alertPrice" type="number" placeholder="Ex: 62300" step="any" class="alert-input"><button onclick="createAlert()" class="alert-create-btn">Criar</button></div><div id="alertStatus" class="alert-status"></div></div><button class="reset-btn" onclick="resetAnalysis()">Nova Analise</button>';
  const el=document.getElementById('result');
  el.innerHTML=html;el.classList.add('show');
  el.scrollIntoView({behavior:'smooth',block:'start'});
}

async function createAlert(){
  const price=parseFloat(document.getElementById('alertPrice').value);
  if(!price||price<=0)return showToast('Mete um preco valido');
  const statusEl=document.getElementById('alertStatus');
  statusEl.textContent='A buscar preco atual...';
  try{
    const currentPrice=await getPrice(selectedPair);
    if(!currentPrice)throw new Error('Nao foi possivel obter preco');
    statusEl.textContent='A criar alerta...';
    const res=await fetch('/set_alert',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        pair:selectedPair,
        target:price,
        current_price:currentPrice,
        analysis:lastAnalysis,
        timeframes:lastTimeframes
      })
    });
    const data=await res.json();
    if(data.error)throw new Error(data.error);
    statusEl.style.color='var(--green)';
    statusEl.textContent='Alerta criado! Avisa quando '+selectedPair+' chegar $'+price+' (preco atual $'+currentPrice.toFixed(2)+')';
    showToast('Alerta criado no Telegram!');
  }catch(e){
    statusEl.style.color='var(--red)';
    statusEl.textContent='Erro: '+e.message;
  }
}

function resetAnalysis(){
  images={};lastAnalysis='';
  document.getElementById('result').classList.remove('show');
  document.getElementById('result').innerHTML='';
  ['D1','H4','H1','M15','M5','M1'].forEach(tf=>{
    const slot=document.getElementById('slot-'+tf);
    const labels={D1:'📅',H4:'🕐',H1:'⏰',M15:'⚡',M5:'🎯',M1:'🔬'};
    const names={D1:'Diario',H4:'4 Horas',H1:'1 Hora',M15:'15 Min',M5:'5 Min Scalp',M1:'1 Min Opcional'};
    slot.classList.remove('filled');
    slot.innerHTML='<div class="slot-icon">'+labels[tf]+'</div><div class="slot-tf">'+tf+'</div><div class="slot-label">'+names[tf]+'</div><input type="file" class="upload-input" id="inp-'+tf+'" accept="image/*" onchange="handleFile(this,\''+tf+'\')">';
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
